[project]
name = "mail-printer-print-agent"
version = "0.1.0"
description = "Shared Raspberry Pi print-agent: accepts one WebSocket connection per app, receives print jobs and prints them via ESC/POS. See docs/decisions/0001-shared-print-agent.md."
requires-python = ">=3.11"
dependencies = [
    "websockets>=13",
    "python-escpos[usb]>=3.1",
    "pillow>=11",
    "mail-printer-protocol",
]

[project.scripts]
mail-printer-print-agent = "mail_printer_print_agent.main:main"

[tool.uv.sources]
mail-printer-protocol = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
